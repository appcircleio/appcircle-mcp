[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "appcircle-mcp-server"
version = "0.1.0"
description = "MCP server for Appcircle: build, distribution, enterprise app store, publish, and reporting tools."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
  { name = "Appcircle" }
]
keywords = ["mcp", "appcircle", "model-context-protocol"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development",
]
dependencies = [
  "mcp==1.26.0",
  "fastmcp==3.2.0",
  "httpx==0.28.1",
  "pydantic==2.12.5",
  "starlette==0.52.1",
  "uvicorn==0.41.0",
  "anyio==4.12.1",
]

[project.optional-dependencies]
dev = [
  "pytest==9.0.2",
  "pytest-asyncio==1.3.0",
  "pytest-cov==7.0.0",
  "respx==0.22.0",
  "pip-audit==2.10.0",
]

[project.scripts]
appcircle-mcp = "src.server:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["test/unit"]
pythonpath = ["."]
addopts = "-v --tb=short"
norecursedirs = ".git .hg __pycache__ .tox .env venv ENV dist"
markers = [
  "integration: integration tests (require APPCIRCLE_ACCESS_TOKEN and real API); run with pytest test/integration/ -v",
]
filterwarnings = [
  "ignore::DeprecationWarning",
  "ignore::PendingDeprecationWarning",
]

[tool.coverage.run]
source = ["src"]
omit = ["src/__main__*", "test/*"]

[tool.coverage.report]
fail_under = 80
exclude_lines = [
  "pragma: no cover",
  "def __repr__",
  "raise NotImplementedError",
]
