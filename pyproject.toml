[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "appcircle-mcp-server"
version = "1.2.1"
description = "MCP server for Appcircle: build, distribution, enterprise app store, publish, and reporting tools."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
  { name = "Appcircle" }
]
keywords = ["mcp", "appcircle", "model-context-protocol"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development",
]
dependencies = [
  "mcp==1.30.0",
  "fastmcp==3.2.0",
  "httpx==0.28.1",
  "pydantic==2.12.5",
  "starlette==1.3.1",
  "uvicorn==0.41.0",
  "anyio==4.14.2",
  "pyyaml==6.0.3",
  "pyjwt==2.15.1",
]

[project.optional-dependencies]
dev = [
  "pytest==9.0.3",
  "pytest-asyncio==1.3.0",
  "pytest-cov==7.0.0",
  "respx==0.22.0",
  "pip-audit==2.10.0",
]

[project.scripts]
appcircle-mcp = "src.server:main"

[tool.uv]
# Security-patched versions for indirect deps not declared in [project.dependencies].
constraint-dependencies = [
  "authlib==1.6.12",
  "certifi==2026.10.19",
  "cryptography==50.0.2",
  "idna==3.15",
  "msgpack==1.2.1",
  "pip==26.2.2",
  "pydantic-settings==2.14.2",
  "pyjwt==2.15.1",
  "python-multipart==0.0.31",
  "urllib3==2.8.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["test/unit"]
pythonpath = ["."]
addopts = "-v --tb=short"
norecursedirs = ".git .hg __pycache__ .tox .env venv ENV dist"
markers = [
  "integration: integration tests (require APPCIRCLE_ACCESS_TOKEN and real API); run with pytest test/integration/ -v",
  "integration_write: write/action integration tests (mutate real data against a real org); require APPCIRCLE_ACCESS_TOKEN AND APPCIRCLE_RUN_WRITE_INTEGRATION_TESTS=true, skipped otherwise even when running the full integration suite",
]
filterwarnings = [
  "ignore::DeprecationWarning",
  "ignore::PendingDeprecationWarning",
]

[tool.coverage.run]
source = ["src"]
omit = ["src/__main__*", "test/*"]

[tool.coverage.report]
fail_under = 80
exclude_lines = [
  "pragma: no cover",
  "def __repr__",
  "raise NotImplementedError",
]
